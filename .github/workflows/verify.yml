name: verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  compatibility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Test Emby compatibility layer
        run: node --test tests/embyCompatibility.test.js

  build-macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          modules: "qtwebengine"
          cache: true
      - name: Install build dependencies
        run: brew install ninja mpv
      - name: Download pinned web client
        run: ./download_webclient.sh
      - name: Configure
        run: >
          cmake -S . -B build -GNinja
          -DQTROOT="$QT_ROOT_DIR"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/output"
      - name: Build and install
        run: cmake --build build --target install
      - name: Test native log redaction
        run: |
          cmake --build build --target LogRedactionTest
          ctest --test-dir build --output-on-failure
      - name: Bundle Homebrew dependencies
        run: python3 scripts/fix-install-names.py "build/output/Terminus Player.app"
      - name: Ad-hoc sign test build
        run: |
          codesign --force --deep --sign - "build/output/Terminus Player.app"
          codesign --verify --deep --strict "build/output/Terminus Player.app"
      - name: Verify application bundle
        run: |
          test -x "build/output/Terminus Player.app/Contents/MacOS/Terminus Player"
          file "build/output/Terminus Player.app/Contents/MacOS/Terminus Player"
          if otool -L "build/output/Terminus Player.app/Contents/MacOS/Terminus Player" | grep -E '/usr/local|/opt/homebrew'; then
            echo "Application still references Homebrew paths." >&2
            exit 1
          fi
      - name: Package test build
        run: >
          ditto -c -k --sequesterRsrc --keepParent
          "build/output/Terminus Player.app"
          TerminusPlayer-macos-intel-test.zip
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: TerminusPlayer-macos-intel-test
          path: TerminusPlayer-macos-intel-test.zip
          if-no-files-found: error
